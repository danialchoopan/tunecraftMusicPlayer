name: TuneCraft CI - Android Build & Artifacts

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build APKs & App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Build Debug & Release APKs & Bundle (AAB)
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TuneCraft-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: TuneCraft-Release-APKs
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Release App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: TuneCraft-Release-AAB
          path: app/build/outputs/bundle/release/*.aab

